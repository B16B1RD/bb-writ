# 補助スクリプト（scripts/）と配布の形の試験を Linux と macOS で回す。秘密の値は使わない（偽物の CLI の試験だけ）。
name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 単体試験
        run: python3 -B -m unittest discover -s tests -t . -v
