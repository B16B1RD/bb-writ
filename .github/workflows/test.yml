# 補助スクリプト（scripts/）と配布の形の試験を Linux と macOS で回す。3.9 は README に書いた下限（macOS の Command Line Tools の python3）。秘密の値は使わない（偽物の CLI の試験だけ）。
name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        python: ["3.9", "3.11"]
    runs-on: ${{ matrix.os }}
    # 上限は最も遅い macOS の成功した実行の最長の 3 倍以上。2026-11 の macOS は 8〜12.9 分（0.22.0 で 11.4 分。0.24.0 で試験が増えて 12.6〜12.9 分。試験 2 本が落ちた回は 14.1 分）で、10 分の上限では全部通る試験が揺れだけで打ち切られた（cancelled）
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: 試験だけの依存
        run: python3 -m pip install -r tests/requirements.txt
      - name: 単体試験
        run: python3 -B -m unittest discover -s tests -t . -v
